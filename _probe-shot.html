<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<title>shot</title><style>html,body{margin:0;padding:0;background:#fff}#f{border:0;display:block}</style></head>
<body>
<iframe id="f" width="390" height="844"></iframe>
<script>
var q=new URLSearchParams(location.search);
var f=document.getElementById('f');
f.src=q.get('p')||'model.html?id=e-class';
f.onload=function(){
  var sel=q.get('sel')||'#options';
  setTimeout(function(){
    var d=f.contentDocument, el=d.querySelector(sel);
    var open=q.get('open'); if(open){ var t=d.querySelector(open); if(t){ t.open=true; } }
    if(el){ var top=el.getBoundingClientRect().top + f.contentWindow.scrollY + (parseInt(q.get('off')||'0',10)); f.contentWindow.scrollTo(0, Math.max(0,top)); }
    window.shotReady=true;
  }, 800);
};
</script>
</body></html>
