<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>probe2</title>
<style>
  html,body{margin:0;padding:0;background:#2b2b2b}
  iframe{display:block;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="f" src="index.html?p=3"></iframe>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w') || '1440', 10);
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  function size() {
    var d = f.contentDocument;
    var h = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
    f.style.height = h + 'px';
    var de = d.documentElement;
    var wr = d.querySelector('.idhero-wrap');
    window.__probe2 = { w: w, h: h, sw: de.scrollWidth, cw: de.clientWidth, overflow: de.scrollWidth - de.clientWidth,
      css: [...d.styleSheets].map(function(s){return s.href;}).filter(Boolean),
      wrapMax: wr ? getComputedStyle(wr).maxWidth : null,
      cardW: d.querySelector('.idc-card') ? Math.round(d.querySelector('.idc-card').getBoundingClientRect().width) : null };
    document.title = 'probe2-ready-' + w + '-' + h;
  }
  f.addEventListener('load', function () { size(); setTimeout(size, 800); });
</script>
</body>
</html>
