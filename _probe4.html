<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>probe4</title>
<style>
  html,body{margin:0;padding:0;background:#2b2b2b}
  iframe{display:block;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="f" src="index.html?p=11"></iframe>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w') || '1440', 10);
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  function size() {
    var d = f.contentDocument;
    var h = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
    f.style.height = h + 'px';
    var de = d.documentElement;
    var img = d.querySelector('.idc-card');
    var hint = d.querySelector('.idc-card-hint');
    var ib = img ? img.getBoundingClientRect() : null, hb = hint ? hint.getBoundingClientRect() : null;
    window.__probe4 = { w: w, h: h, sw: de.scrollWidth, cw: de.clientWidth, overflow: de.scrollWidth - de.clientWidth,
      css: [...d.styleSheets].map(function(s){return s.href;}).filter(Boolean),
      hint: hb ? { top: Math.round(hb.top - ib.top), left: Math.round(hb.left - ib.left), w: Math.round(hb.width), h: Math.round(hb.height), imgH: Math.round(ib.height) } : null };
    document.title = 'probe4-ready-' + w + '-' + h;
  }
  f.addEventListener('load', function () { size(); setTimeout(size, 800); });
</script>
</body>
</html>
