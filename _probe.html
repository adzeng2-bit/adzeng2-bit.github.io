<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>layout probe</title>
<style>
  html,body{margin:0;background:#ddd;font:11px/1.4 monospace}
  iframe{display:block;border:0;height:900px;background:#fff}
  #out{padding:6px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="out">loading…</div>
<div id="frames"></div>
<script>
  var PAGES = ["index.html", "promotion.html", "stock.html", "report.html", "cards.html", "mou.html"];
  var WIDTHS = [390, 1440];
  var CHECK = {
    "promotion.html": function (d) {
      var vis = [].filter.call(d.querySelectorAll(".pv-seg"), function (s) { return !s.hidden; });
      return "visibleGroups=" + vis.length + " rows=" + vis.reduce(function (a, s) { return a + s.querySelectorAll("tbody tr").length; }, 0);
    },
    "stock.html": function (d) { return "stockRows=" + d.querySelectorAll("#stock-list .stock-row").length; },
    "mou.html": function (d) { return "mouItems=" + d.querySelectorAll("#mou-grid > *").length; },
    "cards.html": function (d) { return "cardPick=" + d.querySelectorAll("#card-pick > *").length + " simResults=" + d.querySelectorAll("#sim-results > *").length; },
    "report.html": function (d) { return "tables=" + d.querySelectorAll("table").length + " h2=" + d.querySelectorAll("h2").length; },
    "index.html": function (d) { return "sections=" + d.querySelectorAll("section").length; }
  };
  var results = {}, jobs = [];
  var host = document.getElementById("frames");
  PAGES.forEach(function (p) {
    WIDTHS.forEach(function (w) {
      var f = document.createElement("iframe");
      f.style.width = w + "px";
      f.src = p + "?" + Date.now();
      host.appendChild(f);
      jobs.push({ p: p, w: w, f: f });
    });
  });
  var pending = jobs.length;
  jobs.forEach(function (j) {
    j.f.onload = function () {
      setTimeout(function () {
        var r = {};
        try {
          var d = j.f.contentDocument, de = d.documentElement;
          var over = [];
          d.querySelectorAll("body *").forEach(function (el) {
            if (el.closest(".drawer,.drawer-scrim")) return;
            var b = el.getBoundingClientRect();
            if (b.width > 0 && (b.right > de.clientWidth + 1 || b.left < -1)) over.push(el.tagName + "." + String(el.className || "").slice(0, 28));
          });
          r.clientW = de.clientWidth;
          r.scrollW = de.scrollWidth;
          r.overflow = over.length;
          r.overflowSample = over.slice(0, 4);
          r.check = CHECK[j.p] ? CHECK[j.p](d) : "";
        } catch (e) { r.error = e.message; }
        results[j.p + "@" + j.w] = r;
        if (--pending === 0) {
          var lines = [];
          Object.keys(results).forEach(function (k) {
            var v = results[k];
            lines.push(k.padEnd(26) + " scrollW=" + v.scrollW + "/" + v.clientW + " overflow=" + v.overflow + " " + (v.check || "") + (v.error ? " ERR " + v.error : "") + (v.overflow ? " " + JSON.stringify(v.overflowSample) : ""));
          });
          document.getElementById("out").textContent = lines.join("\n");
        }
      }, 1200);
    };
  });
</script>
</body>
</html>
