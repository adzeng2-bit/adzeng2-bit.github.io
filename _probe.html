<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>probe3 2026-11-20</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#1b1b1b;color:#eee;font:12px/1.5 -apple-system,sans-serif}
  .row{display:flex;flex-wrap:wrap;gap:14px;padding:12px}
  .cell{background:#2b2b2b;padding:6px}
  .cell p{margin:0 0 5px;font-size:11px;color:#9df}
  iframe{border:0;background:#fff;display:block}
  pre{padding:10px;background:#0d0d0d;color:#8f8;font-size:11px;white-space:pre-wrap;margin:10px}
</style>
</head>
<body>
<div id="wrap" class="row"></div>
<pre id="out">measuring…</pre>
<script>
(function () {
  var specs = [
    ['index', 'index.html'],
    ['new-cars', 'new-cars.html'],
    ['models', 'models.html'],
    ['model', 'model.html?id=v-class'],
    ['promotion', 'promotion.html'],
    ['report', 'report.html'],
    ['cards', 'cards.html'],
    ['mou', 'mou.html'],
    ['glc-electric', 'glc-electric.html'],
    ['stock-redirect', 'stock.html']
  ];
  var sizes = [[390, 844], [1440, 900]];
  var wrap = document.getElementById('wrap');
  var recs = [];

  specs.forEach(function (sp) {
    sizes.forEach(function (sz) {
      var name = sp[0] + '·' + sz[0];
      var cell = document.createElement('div');
      cell.className = 'cell';
      var label = document.createElement('p');
      label.textContent = name;
      var f = document.createElement('iframe');
      f.width = sz[0]; f.height = sz[1];
      cell.appendChild(label); cell.appendChild(f);
      wrap.appendChild(cell);

      var rec = { name: name, f: f, errors: [], broken: [], links: [], nav: '', loaded: false, w: sz[0] };
      recs.push(rec);

      try {
        var win = f.contentWindow;
        win.addEventListener('error', function (e) {
          if (e && e.message) rec.errors.push('JS:' + e.message + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno);
          else if (e && e.target && e.target.tagName) rec.errors.push('RES:' + e.target.tagName + ' ' + String(e.target.src || e.target.href || '').split('/').pop());
        }, true);
        win.addEventListener('unhandledrejection', function (e) {
          rec.errors.push('PROMISE:' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      } catch (e) {}

      f.addEventListener('load', function () {
        if (rec.loaded) return;
        rec.loaded = true;
        try {
          var d = f.contentDocument, w = f.contentWindow;
          rec.url = w.location.href;
          rec.sw = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
          rec.cw = d.documentElement.clientWidth;
          rec.iw = w.innerWidth;
          rec.h = d.body.scrollHeight;
          rec.title = d.title;
          [].slice.call(d.images).forEach(function (im) {
            if (im.complete && im.naturalWidth === 0) rec.broken.push(String(im.getAttribute('src')).split('/').pop());
          });
          rec.nav = [].slice.call(d.querySelectorAll('.navbar-inner a')).map(function (a) { return a.textContent.trim(); }).join(' / ');
        } catch (e) { rec.errors.push('ACCESS:' + e.message); }
      });
      f.src = sp[1];
    });
  });

  var linkTargets = ['index.html','new-cars.html','models.html','model.html','promotion.html','report.html',
                     'cards.html','mou.html','glc-electric.html','benefits.html','stock.html','model.html?id=gle',
                     'assets/css/style.css','assets/js/site.js','assets/favicon.svg',
                     'assets/js/stock-data.js','assets/js/stock.js'];
  var checks = [];
  linkTargets.forEach(function (t) {
    checks.push(fetch(t, { method: 'GET', cache: 'no-store' }).then(function (r) {
      return t + ' → ' + r.status;
    }).catch(function () { return t + ' → ERR'; }));
  });

  function report() {
    var lines = [];
    recs.forEach(function (r) {
      lines.push('── ' + r.name + ' | clientW=' + r.cw + ' scrollW=' + r.sw + ' overflow=' + (r.sw - r.cw) + 'px h=' + r.h +
                 ' | JS오류 ' + r.errors.filter(function (x) { return x.indexOf('RES:') !== 0; }).length +
                 ' · 리소스오류 ' + r.errors.filter(function (x) { return x.indexOf('RES:') === 0; }).length +
                 ' · 깨진이미지 ' + r.broken.length);
      lines.push('     final=' + (r.url || '?') + ' | title=' + (r.title || '?'));
      lines.push('     nav=' + (r.nav || '?'));
      if (r.errors.length) lines.push('     ' + r.errors.slice(0, 5).join(' || '));
      if (r.broken.length) lines.push('     broken: ' + r.broken.slice(0, 5).join(', '));
    });
    Promise.all(checks).then(function (res) {
      lines.push('── 상태코드');
      res.forEach(function (x) { lines.push('   ' + x); });
      document.getElementById('out').textContent = lines.join('\n');
    });
  }
  window.__recs = recs;
  setTimeout(report, 7000);
  setInterval(report, 3000);
})();
</script>
</body>
</html>
