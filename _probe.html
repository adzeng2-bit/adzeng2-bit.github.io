<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>probe</title>
<style>
  html,body{margin:0;padding:0;background:#2b2b2b}
  iframe{display:block;border:0;background:#fff;width:100%}
</style>
</head>
<body>
<iframe id="f" src="index.html?probe=1"></iframe>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w') || '1440', 10);
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      var h = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
      f.style.height = h + 'px';
      var de = d.documentElement;
      window.__probe = {
        w: w,
        h: h,
        sw: de.scrollWidth,
        cw: de.clientWidth,
        overflow: de.scrollWidth - de.clientWidth,
        h1: (d.querySelector('h1') || {}).textContent,
        buttons: Array.prototype.map.call(d.querySelectorAll('.idc-act'), function (a) { return a.textContent.trim(); }),
        jsError: window.__err || null
      };
      document.title = 'probe-ready-' + w + '-' + h;
    } catch (e) {
      window.__probe = { error: String(e) };
      document.title = 'probe-error';
    }
  });
  window.addEventListener('error', function (e) { window.__err = String(e.message); });
</script>
</body>
</html>
