<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>probe</title>
<style>
  html,body{margin:0;padding:0;background:#2b2b2b}
  iframe{display:block;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="f" src="index.html?probe=1"></iframe>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w') || '1440', 10);
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  function size() {
    var d = f.contentDocument;
    var h = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
    f.style.height = h + 'px';
    var de = d.documentElement;
    window.__probe = { w: w, h: h, sw: de.scrollWidth, cw: de.clientWidth, overflow: de.scrollWidth - de.clientWidth };
    document.title = 'probe-ready-' + w + '-' + h;
  }
  f.addEventListener('load', function () {
    size();
    setTimeout(size, 600);
  });
</script>
</body>
</html>
