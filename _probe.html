<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>probe</title>
<style>
  body{margin:0;background:#222;color:#eee;font:12px/1.5 -apple-system,sans-serif}
  .row{display:flex;flex-wrap:wrap;gap:16px;padding:12px}
  .cell{background:#333;padding:6px}
  .cell p{margin:0 0 4px;font-size:11px;color:#9df}
  iframe{border:0;background:#fff;display:block}
  pre{padding:8px;background:#111;color:#8f8;font-size:11px;white-space:pre-wrap;margin:8px}
</style>
</head>
<body>
<div id="wrap" class="row"></div>
<pre id="out">measuring…</pre>
<script>
(function () {
  var pages = [
    ['index', 'index.html?probe=1'],
    ['promotion', 'promotion.html'],
    ['stock', 'stock.html'],
    ['models', 'models.html']
  ];
  var wrap = document.getElementById('wrap');
  var frames = [];

  pages.forEach(function (p) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    var label = document.createElement('p');
    label.textContent = p[0] + ' · 390';
    var f = document.createElement('iframe');
    f.width = 390; f.height = 844; f.src = p[1]; f.id = 'f-' + p[0];
    cell.appendChild(label); cell.appendChild(f);
    wrap.appendChild(cell);
    frames.push([p[0], f]);
  });

  // 1440 desktop check (scaled down for screenshot convenience is not applied: real width)
  var cellD = document.createElement('div');
  cellD.className = 'cell';
  var labelD = document.createElement('p');
  labelD.textContent = 'index · 1440';
  var fD = document.createElement('iframe');
  fD.width = 1440; fD.height = 900; fD.src = 'index.html?probe=1'; fD.id = 'f-desktop';
  cellD.appendChild(labelD); cellD.appendChild(fD);
  wrap.appendChild(cellD);
  frames.push(['desktop', fD]);

  function measure(name, f) {
    var w = f.contentWindow, d = f.contentDocument;
    if (!d) return name + ': no document';
    var root = d.documentElement, body = d.body;
    var nav = d.querySelector('[data-nav]'), list = d.querySelector('[data-nav-list]');
    var cur = d.querySelector('.navbar-inner [aria-current="page"]');
    var cs = nav ? w.getComputedStyle(nav) : null;
    var curCs = cur ? w.getComputedStyle(cur) : null;
    var imgs = [].slice.call(d.images).filter(function (i) { return i.getAttribute('src'); });
    var broken = imgs.filter(function (i) { return !i.complete || i.naturalWidth === 0; })
      .map(function (i) { return i.getAttribute('src'); });
    var lineup = d.querySelectorAll('#lineup-grid .lineup-card, #lineup-grid > *').length;
    var tabs = d.querySelectorAll('.tab').length;
    var mb = typeof w.MB !== 'undefined' && typeof w.MB.init === 'function';
    var initErr = '';
    try { if (mb) w.MB.init(); } catch (e) { initErr = String(e); }
    return [
      name,
      '  viewport=' + w.innerWidth + 'x' + w.innerHeight + '  dpr=' + w.devicePixelRatio,
      '  page scrollWidth=' + Math.max(root.scrollWidth, body ? body.scrollWidth : 0) + ' (overflow ' + Math.max(0, Math.max(root.scrollWidth, body ? body.scrollWidth : 0) - w.innerWidth) + 'px)',
      '  navbar display=' + (cs ? cs.display : 'none') + ' height=' + (nav ? Math.round(nav.getBoundingClientRect().height) : 0) + ' top=' + (nav ? Math.round(nav.getBoundingClientRect().top) : -1),
      '  nav list client=' + (list ? Math.round(list.clientWidth) : 0) + ' scroll=' + (list ? Math.round(list.scrollWidth) : 0) + ' innerScroll=' + (list ? list.scrollWidth > list.clientWidth : false),
      '  nav items=' + d.querySelectorAll('.navbar-inner a').length + ' current=' + (cur ? cur.textContent.trim() : 'none') + (curCs ? ' pill=' + curCs.backgroundColor + '/r' + curCs.borderTopLeftRadius : ''),
      '  header total h=' + Math.round((d.querySelector('.site-header') || {getBoundingClientRect:function(){return{height:0}}}).getBoundingClientRect().height),
      '  imgs=' + imgs.length + ' broken=' + broken.length + (broken.length ? ' ' + broken.join(',') : ''),
      '  lineupCards=' + lineup + ' tabs=' + tabs + ' MB.init=' + mb + (initErr ? ' INIT_ERROR=' + initErr : ''),
      '  sections=' + d.querySelectorAll('main section').length + ' consultForm=' + d.querySelectorAll('[data-consult-form]').length,
      '  afterCare=' + !!d.getElementById('after-care') + ' contact=' + !!d.getElementById('contact'),
      '  profileImg=' + ((d.querySelector('.profile-photo img') || {}).naturalWidth || 0)
    ].join('\n');
  }

  var done = 0;
  frames.forEach(function (pair) {
    var name = pair[0], f = pair[1];
    f.addEventListener('load', function () {
      done++;
      var out = document.getElementById('out');
      out.textContent = (out.textContent === 'measuring…' ? '' : out.textContent) + measure(name, f) + '\n\n';
      if (done === frames.length) out.textContent += 'ALL LOADED\n';
    });
  });
})();
</script>
</body>
</html>
