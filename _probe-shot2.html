<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<title>shot2</title><style>html,body{margin:0;padding:0;background:#fff}#f{border:0;display:block}</style></head>
<body>
<iframe id="f" width="390" height="844" src="model.html?id=e-class"></iframe>
<script>
document.getElementById('f').addEventListener('load', function(){
  var f=this, d=f.contentDocument;
  setTimeout(function(){
    var t=d.querySelector('.opt-trim'); if(t) t.open=true;
    var el=d.querySelector('#options');
    if(el){ var top=el.getBoundingClientRect().top + f.contentWindow.scrollY - 96; f.contentWindow.scrollTo(0, top); }
    window.shotReady=true;
  }, 1200);
});
</script>
</body></html>
