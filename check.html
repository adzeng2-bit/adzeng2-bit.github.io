<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAYOUT CHECK</title>
<style>
  body{margin:0;font:13px/1.5 -apple-system,system-ui,sans-serif;background:#222;color:#eee}
  h1{font-size:14px;margin:10px 12px 6px}
  table{border-collapse:collapse;margin:0 12px 14px;font-size:12px}
  td,th{border:1px solid #555;padding:4px 8px;text-align:left}
  .bad{color:#ff6b6b;font-weight:700}.ok{color:#7ee787}
  .frame{background:#fff;margin:0 0 18px 12px;display:block;border:0;box-shadow:0 0 0 2px #555}
  .lbl{margin:0 0 4px 12px;font-size:11px;color:#bbb;letter-spacing:.1em}
</style>
</head>
<body>
<h1>LAYOUT CHECK (임시 검증 페이지)</h1>
<table id="report"><thead><tr><th>page</th><th>width</th><th>hscroll</th><th>scrollW/clientW</th><th>broken</th><th>header</th></tr></thead><tbody></tbody></table>

<div id="mount"></div>

<script>
var PAGES = ["index.html", "models.html", "model.html?id=glc", "benefits.html", "glc-electric.html"];
var WIDTHS = [390, 768, 1440];

function esc(s){ return String(s).replace(/[&<>]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

window.addEventListener("load", function () {
  var mount = document.getElementById("mount");
  var tbody = document.querySelector("#report tbody");
  var frames = [];

  PAGES.forEach(function (page) {
    WIDTHS.forEach(function (w) {
      var lbl = document.createElement("p");
      lbl.className = "lbl";
      lbl.textContent = page + " @ " + w + "px";
      var fr = document.createElement("iframe");
      fr.className = "frame";
      fr.width = w;
      fr.height = 900;
      fr.src = page;
      fr.setAttribute("data-page", page);
      fr.setAttribute("data-w", w);
      mount.appendChild(lbl);
      mount.appendChild(fr);
      frames.push(fr);
    });
  });

  setTimeout(function () {
    frames.forEach(function (fr) {
      var tr = document.createElement("tr");
      var page = fr.getAttribute("data-page"), w = fr.getAttribute("data-w");
      try {
        var d = fr.contentDocument;
        var sw = d.documentElement.scrollWidth, cw = d.documentElement.clientWidth;
        var broken = 0;
        Array.prototype.forEach.call(d.images, function (i) {
          if (i.complete && i.naturalWidth === 0) broken++;
        });
        var hdr = d.querySelector(".site-header");
        var over = sw - cw;
        tr.innerHTML = "<td>" + esc(page) + "</td><td>" + w + "</td><td class='" + (over > 1 ? "bad" : "ok") + "'>" + over +
          "</td><td>" + sw + " / " + cw + "</td><td class='" + (broken ? "bad" : "ok") + "'>" + broken +
          "</td><td>" + (hdr ? Math.round(hdr.getBoundingClientRect().height) : 0) + "px</td>";
      } catch (e) {
        tr.innerHTML = "<td>" + esc(page) + "</td><td>" + w + "</td><td colspan='4' class='bad'>" + e.message + "</td>";
      }
      tbody.appendChild(tr);
    });
  }, 4500);
});
</script>
</body>
</html>
